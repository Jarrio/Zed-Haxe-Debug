id = "haxe-debug"
name = "Haxe Debugger"
version = "0.1.2"
schema_version = 1
authors = ["Jarrio"]
description = "Debug Haxe in Zed: eval (--interp and macros), hxcpp, cppia, HashLink and JavaScript, and Lime, OpenFL, Flixel and Ceramic projects."
repository = "https://github.com/Jarrio/Zed-Haxe-Debug"

# One adapter for every Haxe target: the bridge picks the debugger from the project (see src/lib.rs).
[debug_adapters.Haxe]

# Turns `haxe build.hxml` tasks into debug sessions.
[debug_locators.haxe]
