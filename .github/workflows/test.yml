name: Test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

jobs:
  bridge:
    name: Bridge build and unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: bridge
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # bin/bridge.js is built with Haxe 4.3.7, so the check below can rebuild it byte for byte.
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7
      - run: haxelib newrepo && haxelib install install.hxml --always
      - name: bin/bridge.js matches the source
        if: matrix.os == 'ubuntu-latest'
        run: |
          haxe build.hxml
          git diff --exit-code --stat bin/bridge.js || { echo "Rebuild bin/bridge.js with Haxe 4.3.7 (haxe build.hxml) and commit it."; exit 1; }
      - run: haxe test.hxml

  e2e:
    name: End to end (${{ matrix.os }}, Haxe ${{ matrix.haxe }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        haxe: [4.0.5, 4.3.7, 5.0.0-preview.1, latest]
    runs-on: ${{ matrix.os }}
    # Haxe nightlies change under us; a failure there is worth a look, not a red build.
    continue-on-error: ${{ matrix.haxe == 'latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ matrix.haxe }}
      # hxcpp, for the hxcpp tests, which also need the C++ compiler each runner has: the haxelib release
      # for Haxe 4, and from git for Haxe 5, which refuses the release. The 5.0.0-preview.1 release gets
      # hxcpp from its release date (July 2025): later hxcpp doesn't build its sys.thread classes. The
      # nightly gets master; its failures show without failing the run.
      - name: hxcpp (haxelib)
        if: startsWith(matrix.haxe, '4.')
        run: haxelib install hxcpp --quiet --always
      - name: hxcpp (git)
        if: "!startsWith(matrix.haxe, '4.')"
        shell: bash
        run: |
          git clone --quiet https://github.com/HaxeFoundation/hxcpp "$RUNNER_TEMP/hxcpp"
          if [ "${{ matrix.haxe }}" != latest ]; then git -C "$RUNNER_TEMP/hxcpp" checkout --quiet a428509569b8fa251f2317aa0fe9ed2de1927980; fi
          haxelib dev hxcpp "$RUNNER_TEMP/hxcpp"
          (cd "$RUNNER_TEMP/hxcpp/tools/hxcpp" && haxe compile.hxml)
      # For the HashLink tests: HashLink 1.16, the stable release, which has no Linux binary, so Linux
      # builds the VM. macOS runners are arm64, where the HashLink VM doesn't run; the tests skip there.
      - name: HashLink (Linux)
        if: runner.os == 'Linux'
        run: |
          git clone --depth 1 --branch 1.16 https://github.com/HaxeFoundation/hashlink "$RUNNER_TEMP/hashlink"
          make -C "$RUNNER_TEMP/hashlink" libhl.so hl
          sudo cp "$RUNNER_TEMP/hashlink/libhl.so" /usr/local/lib/ && sudo ldconfig
          echo "$RUNNER_TEMP/hashlink" >> "$GITHUB_PATH"
      - name: HashLink (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hashlink.zip" https://github.com/HaxeFoundation/hashlink/releases/download/1.16/hashlink-1.16.0-win.zip
          unzip -q "$RUNNER_TEMP/hashlink.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/hashlink-1.16.0-win" >> "$GITHUB_PATH"
      - run: node bridge/e2e/run.js
        shell: bash

  # Breakpoints in cppia scripts need libhxcpp, OpenFL's continuation of hxcpp: the only one that tells
  # the debugger when a script loads. The other runs skip the cppia test.
  cppia:
    name: cppia with libhxcpp (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7
      - name: libhxcpp
        shell: bash
        run: |
          git clone --quiet https://github.com/openfl/libhxcpp "$RUNNER_TEMP/libhxcpp"
          git -C "$RUNNER_TEMP/libhxcpp" checkout --quiet 2573b944e6a5661f22639842443f45f2907cc8ed
          haxelib dev hxcpp "$RUNNER_TEMP/libhxcpp"
          (cd "$RUNNER_TEMP/libhxcpp/tools/hxcpp" && haxe compile.hxml)
      # Fails if the test skips: here it has to run.
      - shell: bash
        run: |
          node bridge/e2e/run.js cppia | tee "$RUNNER_TEMP/cppia.txt"
          grep -q "^ok cppia" "$RUNNER_TEMP/cppia.txt"

  package:
    name: Package
    runs-on: ubuntu-latest
    env:
      # The CLI Zed's extension registry builds with (zed-industries/extensions).
      ZED_EXTENSION_CLI: https://zed-extension-cli.nyc3.digitaloceanspaces.com/9ee3c503a4bbbc6b4a0f8a789acca4871d773223/x86_64-unknown-linux-gnu/zed-extension
    steps:
      - uses: actions/checkout@v5
      - run: rustup target add wasm32-wasip2
      - run: |
          curl -fsSL -o "$RUNNER_TEMP/zed-extension" "$ZED_EXTENSION_CLI"
          chmod +x "$RUNNER_TEMP/zed-extension"
          mkdir -p "$RUNNER_TEMP/out" "$RUNNER_TEMP/scratch"
          "$RUNNER_TEMP/zed-extension" --source-dir . --output-dir "$RUNNER_TEMP/out" --scratch-dir "$RUNNER_TEMP/scratch"
          mv "$RUNNER_TEMP/out/archive.tar.gz" haxe-debug.tar.gz
          tar -tzf haxe-debug.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: haxe-debug
          path: haxe-debug.tar.gz

  install:
    name: Install scripts (${{ matrix.os }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      ZED_DATA_DIR: ${{ github.workspace }}/zed-data
      HAXE_DEBUG_ARCHIVE: ${{ github.workspace }}/haxe-debug.tar.gz
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: haxe-debug
      - name: An older install to replace
        shell: bash
        run: |
          mkdir -p "$ZED_DATA_DIR/extensions/installed/haxe-debug"
          touch "$ZED_DATA_DIR/extensions/installed/haxe-debug/old-file" "$ZED_DATA_DIR/extensions/index.json"
      - if: runner.os != 'Windows'
        run: sh scripts/install.sh
      # Windows PowerShell 5.1, the one every Windows has.
      - if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/install.ps1
      - name: Installed
        shell: bash
        run: |
          debug="$ZED_DATA_DIR/extensions/installed/haxe-debug"
          test -f "$debug/extension.toml" && test -f "$debug/extension.wasm" && test -f "$debug/debug_adapter_schemas/Haxe.json"
          test ! -e "$debug/old-file"
          test ! -e "$ZED_DATA_DIR/extensions/index.json"
